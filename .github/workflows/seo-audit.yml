name: SEO Audit & Auto-update

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 6시간마다 실행 (UTC). KST 기준 03:00, 09:00, 15:00, 21:00.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: SEO/keyword audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit (fail on errors)
        run: node scripts/audit.js

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

  auto-refresh:
    name: Refresh sitemap lastmod
    needs: audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update sitemap lastmod from file mtimes
        run: node scripts/update-sitemap.js

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore(seo): auto-refresh sitemap lastmod [skip ci]"
            git push
          else
            echo "sitemap unchanged"
          fi
